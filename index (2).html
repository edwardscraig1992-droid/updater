<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Tools — Update Release</title>
  <style>
    :root { --bg:#05050a; --card:#0c0c16; --cyan:#00f0ff; --text:#e0e0ff; --border:rgba(0,240,255,.3); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:420px; }
    h1 { font-size:22px; letter-spacing:2px; margin-bottom:8px; color:var(--cyan); }
    p { color:#888; margin-bottom:24px; font-size:14px; }
    label { display:block; font-size:13px; margin:12px 0 4px; color:#aaa; }
    input, textarea { width:100%; padding:12px; background:#000; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px; }
    button { width:100%; margin-top:20px; padding:14px; background:linear-gradient(90deg,var(--cyan),#7b2cbf); border:none; border-radius:8px; color:#000; font-weight:700; letter-spacing:1px; cursor:pointer; }
    .status { margin-top:16px; font-size:13px; color:var(--cyan); min-height:20px; }
    .current { background:#000; padding:12px; border-radius:8px; margin-bottom:20px; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CELESTIAL UPDATE</h1>
    <p>Bump the version number. Users see the prompt on next launch.</p>
    <div class="current" id="current">Loading...</div>
    <label>New Version</label>
    <input type="text" id="version" placeholder="1.0.1">
    <label>Notes (optional)</label>
    <textarea id="notes" rows="2" placeholder="What's new"></textarea>
    <button id="publish">SEND UPDATE</button>
    <div class="status" id="status"></div>
  </div>
  <script>
    const currentEl = document.getElementById('current');
    const status = document.getElementById('status');
    async function loadCurrent() {
      try {
        const res = await fetch('version.json?t=' + Date.now());
        const data = await res.json();
        currentEl.textContent = 'Live version: ' + data.version;
        document.getElementById('version').value = data.version;
        document.getElementById('notes').value = data.notes || '';
      } catch { currentEl.textContent = 'No version.json yet'; }
    }
    document.getElementById('publish').addEventListener('click', () => {
      const payload = { version: document.getElementById('version').value.trim(), notes: document.getElementById('notes').value.trim() };
      if (!payload.version) { status.textContent = 'Version required'; return; }
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'version.json';
      a.click();
      status.textContent = 'version.json downloaded — upload it next to this page';
    });
    loadCurrent();
  </script>
</body>
</html>
